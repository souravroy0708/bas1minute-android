[versions]
agp = "8.11.1"
kotlin = "2.2.0"
composeBom = "2025.01.00"
activityCompose = "1.10.1"
fragment = "1.8.5"
lifecycle = "2.8.7"
work = "2.10.1"
healthConnect = "1.1.0"
playFitness = "21.2.0"
coroutines = "1.10.1"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-core" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
# Play services pulls in an old androidx.fragment; this lifts it so the ActivityResult APIs pass lint.
fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
health-connect = { group = "androidx.health.connect", name = "connect-client", version.ref = "healthConnect" }
play-services-fitness = { group = "com.google.android.gms", name = "play-services-fitness", version.ref = "playFitness" }
coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
