name: Build APK and Play bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed to publish GitHub Releases
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for files removed in newer versions
        run: |
          stale=""
          for f in app/src/main/java/com/bas1minute/sync/ui/HomeScreen.kt \
                   app/src/main/java/com/bas1minute/sync/ui/OnboardingScreen.kt; do
            [ -f "$f" ] && stale="$stale $f"
          done
          if [ -n "$stale" ]; then
            echo "::error::These files were removed in a newer version but are still in the repo:$stale"
            echo "Delete them:  git rm$stale && git commit -m 'Remove old screens' && git push"
            echo "Next time, update with ./update-from-zip.sh so removed files are deleted automatically."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.B1M_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No B1M_KEYSTORE_BASE64 secret. This APK uses a throwaway key and testers can't update it in place."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "B1M_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build signed release APK
        env:
          B1M_KEYSTORE_PASSWORD: ${{ secrets.B1M_KEYSTORE_PASSWORD }}
          B1M_KEY_ALIAS: ${{ secrets.B1M_KEY_ALIAS }}
          B1M_KEY_PASSWORD: ${{ secrets.B1M_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/Bas1Minute-v0.5.${{ github.run_number }}.apk"
          # Fixed name too, so this link always gives the newest version:
          # https://github.com/<you>/<repo>/releases/latest/download/Bas1Minute.apk
          cp "app/build/outputs/apk/release/Bas1Minute-v0.5.${{ github.run_number }}.apk" app/build/outputs/apk/release/Bas1Minute.apk

      # Google Play needs an .aab (App Bundle), not an .apk. Only built when your real signing key is
      # configured, because Play rejects bundles signed with the throwaway debug key.
      - name: Build signed release bundle (.aab) for Google Play
        if: env.B1M_KEYSTORE_PATH != ''
        env:
          B1M_KEYSTORE_PASSWORD: ${{ secrets.B1M_KEYSTORE_PASSWORD }}
          B1M_KEY_ALIAS: ${{ secrets.B1M_KEY_ALIAS }}
          B1M_KEY_PASSWORD: ${{ secrets.B1M_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --console=plain
          mv app/build/outputs/bundle/release/app-release.aab "app/build/outputs/bundle/release/Bas1Minute-v0.5.${{ github.run_number }}.aab"

      - name: Warn when no Play bundle was built
        if: env.B1M_KEYSTORE_PATH == ''
        run: echo "::warning::No .aab built. Add the B1M_KEYSTORE_* secrets to get a Google Play bundle."

      - name: Upload Play bundle (.aab)
        if: env.B1M_KEYSTORE_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: Bas1Minute-play-bundle-v0.5.${{ github.run_number }}
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bas1Minute-v0.5.${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publish GitHub Release (signed builds on main only)
        if: success() && env.B1M_KEYSTORE_PATH != '' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.${{ github.run_number }}
          name: Bas 1 Minute 0.5.${{ github.run_number }}
          make_latest: true
          files: |
            app/build/outputs/apk/release/Bas1Minute.apk
            app/build/outputs/apk/release/Bas1Minute-v0.5.${{ github.run_number }}.apk
          body: |
            **Install:** download `Bas1Minute.apk` on your Android phone and open it. If asked, allow installing
            from your browser or Files app. Updating? Just install over the old version; your data stays.

            **"App was denied access" for Usage access?** Android protects this for apps not from the Play Store:
            Settings → Apps → Bas 1 Minute → ⋮ (or the bottom of the page) → Allow restricted settings, then
            switch Usage access on again. The app's Profile → Phone-specific help shows the steps for your phone.

      - name: Upload build reports (only when the build fails)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/intermediates/lint_vital_intermediate_text_report/
          retention-days: 7
