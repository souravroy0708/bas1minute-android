name: Launch smoke test (emulator)

# Builds the release APK twice (normal R8 build, and a build without R8), installs each on an Android
# emulator, taps the launcher icon and reports whether the app opens. If it does not, the first
# FATAL EXCEPTION is printed in the run summary and the full logcat is attached as an artifact.
on:
  workflow_dispatch:

jobs:
  smoke:
    name: launch (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [minified, unminified]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Same Firebase config as the real build, so push/Firebase startup is tested too.
      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          else
            echo "::warning::No GOOGLE_SERVICES_JSON_BASE64 secret: Firebase will not be configured in this test."
          fi

      # No keystore needed: the release build falls back to the debug key, which is fine on an emulator.
      - name: Build release APK
        run: |
          chmod +x gradlew scripts/ci-launch-check.sh
          EXTRA=""
          if [ "${{ matrix.variant }}" = "unminified" ]; then EXTRA="-Pb1m.noMinify=true"; fi
          ./gradlew assembleRelease $EXTRA --console=plain

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/ci-launch-check.sh app/build/outputs/apk/release/app-release.apk ci-out

      - name: Summary
        if: always()
        run: |
          {
            echo "## Launch test: ${{ matrix.variant }}"
            echo '```'
            cat ci-out/result.txt 2>/dev/null || echo "no result (emulator or install step failed)"
            echo '```'
            if [ -s ci-out/logcat_crash.txt ]; then
              echo "### First crash in logcat"
              echo '```'
              grep -m1 -A40 "FATAL EXCEPTION" ci-out/logcat_crash.txt || head -60 ci-out/logcat_crash.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-test-${{ matrix.variant }}
          path: |
            ci-out/
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 14
